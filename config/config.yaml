# =====================================================================================
# Configuration for the ONT ligated-DNA selection-screen workflow.
#
# Every path/parameter the workflow needs lives here — the Snakefile and rules read
# ONLY from this file, so the workflow is portable: point these at your data on any
# machine (add `linux-64` to pixi.toml `platforms` first if you are not on aarch64).
#
# Paths may be absolute or relative to the workflow repo root (where you run snakemake).
# =====================================================================================

# Everything the workflow produces lands under this directory.
outdir: results

# ---- decontamination genomes (host/contaminant depletion in `clean`) ----------------
# A read is KEPT only if it is unmapped to EVERY genome listed here (order doesn't change
# the result). `clean` chains one `minimap2 | samtools fastq -f 4` depletion per genome,
# then a single length filter. Each genome is a reusable global index: `mmi` (REQUIRED) is
# the index path; if it's missing and `fasta` is given, build_index builds it there once
# and reuses it (`if [ ! -f "$MMI" ]`-style). For one genome, use a one-element list.
decontaminate:
  - name: human
    mmi:   /home/hongj/references/Genomes/Human/GRCh38.map-ont.mmi
    fasta: /home/hongj/references/Genomes/Human/GRCh38.primary_assembly.genome.fa  # source; only used if mmi is missing (local path or https URL)
  # - name: mouse                 # add more genomes to also deplete against them
  #   mmi:   /home/hongj/references/Genomes/Mouse/GRCm39.map-ont.mmi
  #   fasta: /home/hongj/references/Genomes/Mouse/GRCm39.fa
index_preset: map-ont            # minimap2 -x preset for both build (-d) and align

# ---- preprocessing resources (shipped in resources/, override per project) ----------
adapters_fasta:   resources/adapters.fasta        # >Forward_Primer / >Backward_primer
pychopper_config: resources/pychopper_config.txt  # primer-name config; names must match adapters

# ---- LigandFrags2 decode tool (private repo — NOT cloned by the workflow) ------------
# Provide EITHER a prebuilt `binary` OR `source` (a working tree already checked out to
# the desired branch). If `binary` is null, `build_ligandfrags` compiles it with cargo.
ligandfrags:
  binary: null
  source: /home/hongj/tools/LigatedDNA-main
  manifest_subpath: Cargo.toml
  bin_name: LigandFrags2

# ---- decode inputs ------------------------------------------------------------------
expected_sequences: /home/hongj/projects/cell/exp/Cell_uptake_expected_sequences_updated_260707.csv
decode_format: parquet

# ---- tunables (were env vars / hardcoded constants in the scripts) ------------------
params:
  minlen: 103        # clean: keep reads strictly longer than this (drop len <= minlen)
  zmin:   104        # pychopper -z : min complete-molecule length for the construct
  ntrain: 50000      # train_hmm subsample size (0 = train on the full initial library)

# ---- UMI processing (decode -> {dedup, umi} -> featurecount/reports) -----------------
# `mode` selects the behaviour:
#   filter  -- QC-filter garbage UMIs only (non-ACGT / low-complexity / bad UMI length);
#              featurecount and reports run on the filtered `dedup/` tree.
#   correct -- (default) filter, then CORRECT near-identical UMIs to their most-abundant ed<=1
#              variant (starcode -d 1 -s) while KEEPING every read. This adds a separate `umi/`
#              characterisation branch: per-molecule read counts, a per-group UMI x sample matrix,
#              and a cross-sample UMI report. Fragment featurecount/reports are UNAFFECTED.
#   dedup   -- filter, then COLLAPSE duplicates to one representative read per molecule; the
#              collapsed tree feeds featurecount/reports (classic UMI dedup).
umi:
  mode: correct          # filter | correct | dedup
  max_homopolymer: 8     # drop a UMI whose longest homopolymer run is >= this
  max_base_frac:   0.7   # drop a UMI where any single base's fraction is >= this
  # The UMI-length window (10..12 per UMI) is a constant in workflow/scripts/umi_filter_lib.py,
  # not a CLI flag, so it is deliberately not exposed here.

# ---- per-rule thread counts (Snakemake -j caps total concurrency) -------------------
threads:
  clean:     18
  pychopper: 18
  decode:    8       # -> RAYON_NUM_THREADS for the Rust decoder
  dedup:     8       # recorded in provenance only; starcode is pinned to -t 1 (reproducibility)

# ---- reports ------------------------------------------------------------------------
report:
  r0_baseline: true  # wire the initial library as the shared R0 baseline in the cross report

# ---- groups and samples -------------------------------------------------------------
# READ THIS BEFORE EDITING THE TABLE BELOW. There is no `role:` field: a sample's GROUP decides
# everything -- which tree it is decoded into, whether it forms a group matrix, how its complexity
# collapse is labelled. A bad table is REJECTED at parse time, with a message naming the offending
# sample; the workflow never guesses what you meant and never quietly works around it.
#
# `groups:` DECLARES every group name used in `samples:`. That is what makes a typo an error instead of
# a brand-new, silently half-empty arm: write `group: A594` for one MDA round and, without this list,
# you get a third "cell line" with one sample in it and no warning. Every declared group must have at
# least one sample (an empty declaration raises too), and every group EXCEPT `initial` gets its own
# group x sample matrix, its own colour, and its own line in every report.
#
# WRITING YOUR OWN CONFIG: declare `groups:` IN THE SAME FILE that carries your `samples:`. Snakemake
# layers a `--configfile` ON TOP of this default config rather than replacing it, so a top-level key
# your file omits is silently inherited from here -- your samples would then be validated against a
# group list you never wrote. The workflow raises instead of letting that happen.
#
# TWO RESERVED GROUP NAMES:
#
#   initial -- the R0 baseline library. EXACTLY ONE sample (one config = one project = one R0). It is
#              decoded into its own `*_initial/` tree and wired in as the shared first column of every
#              group matrix, so the cross-reports never see it as both a column and the baseline.
#
#   empty   -- the EMPTY / PCR-only rounds: the same aliquot transfers and PCR cycles as a selection
#              round, but NO biological material. Each transfer is itself a bottleneck, so complexity
#              collapses even with no selection -- an empty round is the ONLY way to separate the
#              collapse caused by SELECTION from the collapse caused by the PROTOCOL. It is a full PEER
#              of a cell-line arm: its own matrix, its own colour, its own C_eff trajectory line, its
#              own UpSet panel. It is special in exactly ONE place -- the collapse table, where its
#              collapse vs R0 is labelled `protocol` instead of `total`, because with no cells that
#              ratio IS what the plumbing cost. At most ONE empty sample per `round` (it is the null
#              that every real sample of that round is compared against). To add one: put `empty` in
#              `groups:` and its rounds in `samples:`. Nothing else changes.
#
# Every other group is a selection arm (here, a cell line: A549 / MDA).
#
# ORDER MATTERS IN `samples:`, NOT IN `groups:`. Report colours are assigned in the order a group FIRST
# APPEARS in `samples:` -- the `groups:` list itself never reaches a report. So APPEND a new group's rows
# at the END of `samples:`. Insert them in the middle and every group below them is silently re-coloured
# in all three reports.
#
# Per-sample keys (all four required):
#   name  -- globally unique. It becomes a DIRECTORY and the filename stem inside it
#            (results/umi/<name>/<name>.fused.parquet), so it must be path-safe: no '/', no spaces.
#            It MAY be the same as a group name -- a name is a directory, a group is a filename stem,
#            and they are different things.
#   group -- must be listed in `groups:` above.
#   round -- an integer. R0 = the initial library. It orders a group's samples, and pairs an `empty`
#            round to the real rounds with the same transfer/PCR count.
#   fastq -- absolute path, and the FILE MUST EXIST: snakemake stats every input even on a dry run.
groups: [initial, A549, MDA]   # add `empty` here when you add empty/PCR-only rounds below
samples:
  - {name: A549_R1, group: A549, round: 1, fastq: /home/hongj/projects/cell/rawdata/ONT/A549/A549_R1.fastq}
  - {name: A549_R2, group: A549, round: 2, fastq: /home/hongj/projects/cell/rawdata/ONT/A549/A549_R2.fastq}
  - {name: A549_R3, group: A549, round: 3, fastq: /home/hongj/projects/cell/rawdata/ONT/A549/A549_R3.fastq}
  - {name: A549_R4, group: A549, round: 4, fastq: /home/hongj/projects/cell/rawdata/ONT/A549/A549_R4.fastq}
  - {name: A549_R5, group: A549, round: 5, fastq: /home/hongj/projects/cell/rawdata/ONT/A549/A549_R5.fastq}
  - {name: MDA_R1,  group: MDA,  round: 1, fastq: /home/hongj/projects/cell/rawdata/ONT/MDA/MDA_R1.fastq}
  - {name: MDA_R2,  group: MDA,  round: 2, fastq: /home/hongj/projects/cell/rawdata/ONT/MDA/MDA_R2.fastq}
  - {name: MDA_R3,  group: MDA,  round: 3, fastq: /home/hongj/projects/cell/rawdata/ONT/MDA/MDA_R3.fastq}
  - {name: MDA_R4,  group: MDA,  round: 4, fastq: /home/hongj/projects/cell/rawdata/ONT/MDA/MDA_R4.fastq}
  - {name: MDA_R5,  group: MDA,  round: 5, fastq: /home/hongj/projects/cell/rawdata/ONT/MDA/MDA_R5.fastq}
  - {name: 2026initial_library, group: initial, round: 0, fastq: /home/hongj/projects/cell/rawdata/ONT/initial4A549_MDA/2026initial_library.fastq}
  # An empty / PCR-only round, if the project has one -- declare `empty` in `groups:` above, then:
  # - {name: empty_R5, group: empty, round: 5, fastq: /abs/path/to/empty_R5.fastq}
