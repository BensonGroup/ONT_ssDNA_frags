<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Static analysis and QC figures</title>
<!-- INLINE_STYLE -->
</head>
<body>
<button class=themebtn onclick="(function(){var d=document.documentElement,t=d.getAttribute('data-theme')=='dark'?'light':'dark';d.setAttribute('data-theme',t);try{localStorage.setItem('theme',t);}catch(e){}})()">&#9680; theme</button>
